[storage]
engine = icloud

# Mackup syncs only the apps listed here. Everything else has one other owner:
#
# - chezmoi, for any file it can keep in the repo: text configs (ghostty,
#   btop, gh, opencode, poetry, jupyter), the ColorSync profiles, and the
#   macOS settings in .chezmoidata/macos.yaml. iTerm2 and Karabiner-Elements
#   rewrite their settings, so ~/.config/iterm2prefs and ~/.config/karabiner
#   are symlinks into the repo's app-settings/ directory.
# - Nobody, for secrets and per-machine state, which stay on each machine and
#   are never synced: ~/.aws/credentials, ~/.docker/config.json (registry
#   tokens), ~/.codex/auth.json, ~/.local/share/opencode/auth.json,
#   rclone.conf (OAuth tokens), ~/.gnupg, shell and IPython history,
#   ~/.wget-hsts and Terraform checkpoints.
#
# An app listed here must store its settings in a way chezmoi cannot own:
# a plist the app keeps rewriting, a sandbox container, or a database.
# `macosx` is left out because it syncs .GlobalPreferences.plist, which
# macos.yaml owns; symbolichotkeys (~/.mackup/symbolichotkeys.cfg) syncs
# only the keyboard shortcuts from it. Terminal's plist also holds keys that
# macos.yaml sets: the restore runs before those are written, so they win.

[applications_to_sync]
aldente
amethyst
appcleaner
bartender
handbrake
iina
insomnia
istat-menus
symbolichotkeys
terminal
timeout
vlc
xcode
